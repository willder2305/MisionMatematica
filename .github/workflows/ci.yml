name: Validacion

on:
  push:
    branches: [main, local]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --password=ci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: development
      FLASK_DEBUG: "false"
      JWT_SECRET_KEY: ci-jwt-secret-not-for-production
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_NAME: tesis_matematica_app
      FRONTEND_URLS: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias backend
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Inicializar esquema de pruebas
        run: mysql -h 127.0.0.1 -u root -pci-root-password < database/init_database.sql
      - name: Ejecutar pruebas backend
        working-directory: backend
        run: python -m unittest discover -s tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci
      - name: Ejecutar pruebas Node
        working-directory: frontend
        run: npm run test:labels
      - name: Construir frontend
        working-directory: frontend
        run: npm run build

  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen backend
        run: docker build --file backend/Dockerfile backend
      - name: Construir imagen frontend
        run: docker build --file frontend/Dockerfile .
